# ansible/k8s_setup.yml
# K3s Installation

- name: Install and Configure K3s (Lightweight Kubernetes)
  hosts: devsecops_vm
  become: yes # Run tasks with root privileges

  tasks:
    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s_install.sh
        mode: "0755"

    - name: Execute K3s installation script
      ansible.builtin.command: /tmp/k3s_install.sh
      environment:
        # Allows the devsecops user to read the kubeconfig file
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 644"
      register: k3s_install
      changed_when: "'No change' not in k3s_install.stdout"

    - name: Ensure K3s service is running and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: yes

    - name: Verify Kubernetes node is ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false

    - name: Display K3s node status
      ansible.builtin.debug:
        var: k3s_nodes.stdout_lines
