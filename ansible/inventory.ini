# ==============================================================================
# FILE: ansible/inventory.ini
# PURPOSE: Defines the target infrastructure and authentication parameters.
#
# SRE CONTEXT:
# In an agentless setup, Ansible needs to know WHERE to connect and HOW to
# authenticate securely without relying on static passwords.
# ==============================================================================

# The [k3s_nodes] block defines a group of servers. In this case, our single VM.
[k3s_nodes]
# ACTION REQUIRED: Replace the placeholder below with the actual Public IP
# output generated by your Terraform deployment.
<VM_PUBLIC_IP>

# The [k3s_nodes:vars] block applies specific configuration variables to all
# hosts within the 'k3s_nodes' group.
[k3s_nodes:vars]
# SECURITY: Enforce the Principle of Least Privilege. We connect as a standard
# user ('devsecops') rather than 'root'.
ansible_user=devsecops

# AUTHENTICATION: Use the dynamically generated SSH private key from Terraform.
# This ensures a Zero-Trust connection (no passwords).
ansible_ssh_private_key_file=~/.ssh/id_rsa

# FINOPS & AUTOMATION FIX:
# In ephemeral environments, VMs are destroyed and recreated constantly, changing
# their SSH fingerprints. Bypassing StrictHostKeyChecking prevents the pipeline
# or terminal from hanging on a "yes/no" prompt when connecting to a "new" host.
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# PRIVILEGE ESCALATION:
# Instructs Ansible to elevate privileges (run as root via sudo) ONLY when
# a specific task requires it (e.g., installing packages).
ansible_become=yes
ansible_become_method=sudo