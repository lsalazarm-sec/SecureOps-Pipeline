# azure-pipelines.yml
# Purpose: CI/CD Pipeline for SecureOps Infrastructure using Terraform & OIDC

trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  # Replace with the exact name of your Service Connection
  SERVICE_CONNECTION: "az-secureops-conn"

steps:
  - task: AzureCLI@2
    displayName: "Terraform Initialize and Plan"
    inputs:
      azureSubscription: $(SERVICE_CONNECTION)
      addSpnToEnvironment: true
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        echo "=== 1. Navigating to Infrastructure Directory ==="
        cd infra

        echo "=== 2. Initializing Terraform with Dynamic Backend ==="
        terraform init -backend-config="storage_account_name=$(STORAGE_ACCOUNT_NAME)"

        echo "=== 3. Running Terraform Plan ==="
        terraform plan -out=main.tfplan
