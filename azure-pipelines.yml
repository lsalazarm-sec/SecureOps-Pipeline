# ==============================================================================
# azure-pipelines.yml
# Purpose: Enterprise-grade CI/CD Pipeline for SecureOps Infrastructure
# Architecture: Zero-Trust Identity (OIDC), Dynamic Backend State, SAST Gates
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude: #Avoid unnecesary commits and Pipeline runs
      - README.md
      - docs/**
      - scripts/**
      - ansible/**

pool:
  vmImage: "ubuntu-latest" # Uses an ephemeral, Microsoft-hosted Linux agent

variables:
  # OIDC Service Connection for secretless Azure authentication
  SERVICE_CONNECTION: "az-secureops-oidc-conn"
  # Pinning Terraform version for immutable and predictable builds (SRE Best Practice)
  TF_VERSION: "1.9.4"

jobs:
  # ============================================================================
  # JOB: TerraformDeploy
  # Purpose: Audits code for security risks, plans, and deploys infrastructure
  # ============================================================================
  - job: TerraformDeploy
    displayName: "Secure CI/CD Deployment"
    steps:
      # ------------------------------------------------------------------------
      # STEP 1: Toolchain Setup
      # Description: Native agents might lack Terraform or have breaking versions.
      # This bash step explicitly downloads and installs our pinned version.
      # ------------------------------------------------------------------------
      - bash: |
          echo "=== Downloading Terraform v$(TF_VERSION) ==="
          wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
          unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform -version
        displayName: "Step 1: Install Terraform CLI"

      # ------------------------------------------------------------------------
      # STEP 2: SAST Security Gate (Shift-Left)
      # Description: Checkov scans the IaC files for security misconfigurations.
      # If a critical vulnerability is found, the pipeline FAILS and BLOCKS deployment.
      # ------------------------------------------------------------------------
      - bash: |
          echo "=== 1. Installing Checkov ==="
          pip install checkov --quiet

          echo "=== 2. Running Security Scan on /infra ==="
          checkov -d infra/
        displayName: "Step 2: SAST Security Gate (Checkov)"

      # ------------------------------------------------------------------------
      # STEP 3: Authenticate, Plan, and Deploy (Zero-Touch Implementation)
      # Description: Uses OIDC to securely log into Azure. Generates ephemeral
      # SSH keys and fetches the agent's dynamic IP, injecting both directly
      # into Terraform's memory via TF_VAR_ environment variables. This eliminates
      # all hardcoded values and local file dependencies.
      # ------------------------------------------------------------------------
      - task: AzureCLI@2
        displayName: "Step 3: Terraform Init, Plan and Apply (Zero-Touch)"
        inputs:
          azureSubscription: $(SERVICE_CONNECTION)
          addSpnToEnvironment: true # CRITICAL: Exposes ephemeral OIDC token to the agent
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
            echo "=== 0. Mapping OIDC Tokens to Terraform ==="
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN=$idToken
            export ARM_CLIENT_ID=$servicePrincipalId
            export ARM_TENANT_ID=$tenantId
            export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

            echo "=== 1. Navigating to Infrastructure Directory ==="
            cd infra

            echo "=== 1.5 Extracting Dynamic Context for Zero-Touch Provisioning ==="
            ssh-keygen -t ed25519 -f ephemeral_ssh_key -q -N ""
            export TF_VAR_admin_ssh_public_key=$(cat ephemeral_ssh_key.pub)

            export AGENT_IP=$(curl -s https://api.ipify.org)
            echo "Pipeline Agent Public IP identified as: $AGENT_IP"
            export TF_VAR_admin_ip=$AGENT_IP

            echo "=== 2. Initializing Terraform with Dynamic Backend ==="
            terraform init \
              -backend-config="resource_group_name=$(BACKEND_RG_NAME)" \
              -backend-config="storage_account_name=$(STORAGE_ACCOUNT_NAME)" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"

            echo "=== 3. Running Terraform Plan ==="
            terraform plan -out=main.tfplan

            echo "=== 3.5. Security Scanning (Checkov Shift-Left) ==="
            # SRE Practice: Fail the pipeline immediately if Checkov detects critical IaC vulnerabilities.
            pip install checkov --quiet
            echo "[+] Running Checkov against Terraform definitions..."
            checkov -d . --framework terraform

            echo "=== 4. Executing Terraform Apply ==="
            terraform apply -auto-approve main.tfplan

      # ------------------------------------------------------------------------
      # STEP 4: Configuration Management (Ansible & K3s Hardening)
      # Description: Extracts the dynamic IP from Terraform outputs, bypasses
      # strict host key checking for the ephemeral VM, and executes the playbook.
      # ------------------------------------------------------------------------
      - task: AzureCLI@2
        displayName: "Step 4: Ansible Configuration & K3s Hardening"
        inputs:
          azureSubscription: $(SERVICE_CONNECTION)
          addSpnToEnvironment: true
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
            echo "=== 0. Mapping OIDC Tokens to Terraform ==="
            export ARM_USE_OIDC=true
            export ARM_OIDC_TOKEN=$idToken
            export ARM_CLIENT_ID=$servicePrincipalId
            export ARM_TENANT_ID=$tenantId
            export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

            echo "=== 1. Extracting Dynamic IP from Terraform ==="
            cd infra
            export VM_IP=$(terraform output -raw vm_public_ip)
            echo "Target VM IP identified as: $VM_IP"

            echo "=== 2. Configuring Ansible Environment ==="
            cd ../ansible
            export ANSIBLE_HOST_KEY_CHECKING=False

            echo "=== 3. Executing Master Playbook ==="
            echo -e "[k3s_nodes]\n$VM_IP" > dynamic_inv.ini
            ansible-playbook -i dynamic_inv.ini -u devsecops --private-key ../infra/ephemeral_ssh_key main.yml

      # ------------------------------------------------------------------------
      # STEP 5: Publish Kubeconfig Artifact
      # Description: Intercepts the k3s.yaml extracted by Ansible and publishes
      # it to the Azure DevOps portal so it can be downloaded to GhostShell.
      # ------------------------------------------------------------------------
      - task: PublishPipelineArtifact@1
        displayName: "Step 5: Publish Kubeconfig Artifact"
        inputs:
          targetPath: "infra/k3s.yaml"
          artifact: "kubeconfig"
          publishLocation: "pipeline"
